name: iOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: >-
          xcodebuild -resolvePackageDependencies
          -project InboxBrief.xcodeproj
          -scheme InboxBrief

      - name: Install iOS Simulator runtime
        run: |
          runtime_directory="$RUNNER_TEMP/ios-simulator-runtime"
          mkdir -p "$runtime_directory"
          xcodebuild -downloadPlatform iOS -exportPath "$runtime_directory"
          xcodebuild -importPlatform "$runtime_directory"/*.dmg

      - name: Create simulator
        run: |
          simulator_id="$(xcrun simctl create 'InboxBrief CI' 'iPhone 16 Pro')"
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Run tests
        run: >-
          xcodebuild test
          -project InboxBrief.xcodeproj
          -scheme InboxBrief
          -destination 'platform=iOS Simulator,id=${{ env.SIMULATOR_ID }}'
          -parallel-testing-enabled NO
          -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
